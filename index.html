<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lemonade to Legacy — Business Tycoon</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <header id="topbar">
    <div id="brand">
      <span id="tierEmoji">🍋</span>
      <div>
        <h1 id="tierName">Lemonade Stand</h1>
        <p id="tierProduct">Selling cups of lemonade</p>
      </div>
    </div>
    <div id="stats">
      <div class="stat"><span class="label">Day</span><span class="value" id="dayValue">1</span></div>
      <div class="stat"><span class="label">Cash</span><span class="value" id="cashValue">$0</span></div>
      <div class="stat"><span class="label">Reputation</span><span class="value" id="repValue">50%</span></div>
    </div>
  </header>

  <div id="upgradeBanner" class="hidden">
    <span id="upgradeText"></span>
    <button id="upgradeBtn">Upgrade Now</button>
  </div>

  <main id="layout">

    <section id="controlsPanel" class="panel">
      <h2>Run Your Business</h2>

      <div class="field">
        <label for="priceInput">Price per unit <span class="hint" id="idealPriceHint"></span></label>
        <input type="number" id="priceInput" min="0" step="0.01">
      </div>

      <div class="field">
        <label for="buyQtyInput">Buy inventory <span class="hint" id="unitCostHint"></span></label>
        <div class="inline">
          <input type="number" id="buyQtyInput" min="0" step="1" value="0">
          <button id="buyBtn">Buy</button>
        </div>
        <p class="hint">On hand: <span id="inventoryValue">0</span> units</p>
      </div>

      <div class="field">
        <label for="marketingInput">Marketing spend today</label>
        <input type="number" id="marketingInput" min="0" step="1" value="0">
      </div>

      <div class="field">
        <label>Staff <span class="hint" id="wageHint"></span></label>
        <div class="inline">
          <button id="fireBtn">– Fire</button>
          <span id="employeeCount">0</span>
          <button id="hireBtn">+ Hire</button>
        </div>
      </div>

      <button id="runDayBtn" class="primary">Run Day ▶</button>
      <button id="resetBtn" class="ghost">New Game</button>
    </section>

    <section id="infoPanel" class="panel">
      <h2>Business Snapshot</h2>
      <canvas id="cashChart" width="400" height="120"></canvas>
      <ul id="snapshotList"></ul>

      <h2>Day Log</h2>
      <div id="log"></div>
    </section>

  </main>
</div>

<script src="script.js"></script>
</body>
</html>

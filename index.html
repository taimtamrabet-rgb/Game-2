<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lemonade to Legacy — Life &amp; Business Sim</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="shell">

  <div id="onboarding">
    <h1>Start Your Life</h1>
    <p>You're 22, fresh out of college, with <strong>$50,000</strong> in student loans and <strong>$500</strong> to your name. Choose your degree — it shapes which jobs are open to you.</p>
    <div class="degree-grid">
      <button class="degree-card" data-action="choose-degree" data-degree="law">
        <div class="degree-title">Law <span class="badge">Easy</span></div>
        <p>Stable pay, a straightforward ladder. Paralegal to partner.</p>
      </button>
      <button class="degree-card" data-action="choose-degree" data-degree="finance">
        <div class="degree-title">Finance <span class="badge">Medium</span></div>
        <p>Decent pay, steady promotions if you put in the years.</p>
      </button>
      <button class="degree-card" data-action="choose-degree" data-degree="art">
        <div class="degree-title">Art <span class="badge">Hard</span></div>
        <p>Low, unstable pay early on — but the ceiling is high if you make it.</p>
      </button>
    </div>
  </div>

  <div id="game" class="hidden">
    <header id="topbar">
      <div id="ageBlock">
        <span id="ageValue">22y 0w</span>
        <span id="weekValue" class="muted">Week 1</span>
      </div>
      <div id="netWorthBlock">
        <span class="label">Net Worth</span>
        <span id="netWorthValue">$0.00</span>
      </div>
      <button id="advanceBtn" data-action="advance-week">Advance Week ▶</button>
    </header>

    <main id="tabContent">
      <section id="tab-home" class="tab-panel"></section>
      <section id="tab-job" class="tab-panel hidden"></section>
      <section id="tab-business" class="tab-panel hidden"></section>
      <section id="tab-banking" class="tab-panel hidden"></section>
      <section id="tab-skills" class="tab-panel hidden"></section>
      <section id="tab-life" class="tab-panel hidden"></section>
    </main>

    <nav id="bottomNav">
      <button data-action="switch-tab" data-tab="home" class="active"><span class="nav-icon">🏠</span>Home</button>
      <button data-action="switch-tab" data-tab="job"><span class="nav-icon">💼</span>Job</button>
      <button data-action="switch-tab" data-tab="business"><span class="nav-icon">🏪</span>Business</button>
      <button data-action="switch-tab" data-tab="banking"><span class="nav-icon">🏦</span>Banking</button>
      <button data-action="switch-tab" data-tab="skills"><span class="nav-icon">🎓</span>Skills</button>
      <button data-action="switch-tab" data-tab="life"><span class="nav-icon">🧭</span>Life</button>
    </nav>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
